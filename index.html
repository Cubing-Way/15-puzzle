<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>15 Puzzle Sim</title>

    <link
        rel="stylesheet"
        href="desktop.css"
        media="(min-width: 601px)"
    >

    <link
        rel="stylesheet"
        href="mobile.css"
        media="(max-width: 600px)"
    >

    <link
        rel="stylesheet"
        href="puzzle.css?v=2"
    >
    
</head>

<body>

    <header id="app-header">

        <div id="brand">
            <h1>15 Puzzle</h1>
            <p>Puzzle Simulator</p>
        </div>

        <div id="header-actions">

            
        <select id="puzzle-theme-select">
            <option value="puzzle-neon-clean">Default</option>
            <option value="puzzle-neon">Neon</option>
            <option value="puzzle-modern">Modern</option>
            <option value="puzzle-glass">Glass</option>
            <option value="puzzle-soft">Soft</option>
            <option value="puzzle-arcade">Arcade</option>
            <option value="puzzle-minimal">Minimal</option>
            <option value="puzzle-midnight">Midnight</option>
            <option value="puzzle-ocean">Ocean</option>
            <option value="puzzle-sunset">Sunset</option>
            <option value="puzzle-forest">Forest</option>
            <option value="puzzle-monochrome">Monochrome</option>
            <option value="puzzle-wood">Wood</option>
            <option value="puzzle-blueprint">Blueprint</option>
            <option value="puzzle-candy">Candy</option>
            <option value="puzzle-lava">Lava</option>
            <option value="puzzle-aurora">Aurora</option>
            <option value="puzzle-sakura">Sakura</option>
            <option value="puzzle-terminal">Terminal</option>
            <option value="puzzle-ice">Ice</option>
            <option value="puzzle-gold">Gold</option>
            <option value="puzzle-handheld">Handheld</option>
            <option value="puzzle-chalkboard">Chalkboard</option>
            <option value="puzzle-synthwave">Synthwave</option>
        </select>

<select id="puzzle-color-select">
    <option value="">Default Color</option>
    <option value="red">Red</option>
    <option value="orange">Orange</option>
    <option value="yellow">Yellow</option>
    <option value="lime">Lime</option>
    <option value="green">Green</option>
    <option value="teal">Teal</option>
    <option value="cyan">Cyan</option>
    <option value="blue">Blue</option>
    <option value="purple">Purple</option>
    <option value="magenta">Magenta</option>
    <option value="pink">Pink</option>
</select>        

            <div id="theme-toggle">

                <span class="theme-icon">☀</span>

                <label class="switch">
                    <input
                        type="checkbox"
                        id="dark-mode-option"
                    >

                    <span class="slider"></span>
                </label>

                <span class="theme-icon">☾</span>

            </div>

        </div>

    </header>

    <main id="app">

        <aside id="sidebar">

            <div id="options"></div>

        </aside>

        <section id="game">
            <div id="game-info">
                
                <select
                    id="size-select"
                    aria-label="Puzzle size"
                ></select>

                <div id="scramble-control"></div>

               <div id="reset-control"></div>
            </div>

            <div id="fifteen-puzzle" class="puzzle-neon-clean"></div>

            <div id="stats"></div>

            <div id="solved-message"></div>

        </section>
        <aside id="avgRightSidebar">-</aside>
    </main>
    <script type="module" src="main.js"></script>
</body>
</html>
